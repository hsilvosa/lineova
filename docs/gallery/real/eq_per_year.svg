<title id="lvd73b6a29t">Recorded earthquakes per year</title>
<desc id="lvd73b6a29d">Recorded earthquakes per year. Growth reflects more seismometers, not more earthquakes. Line chart of events per year, t from 1900-01-01 to 2026-01-01. events per year: from 12 to 22.3k, last 6,482, up 53917% from the start.</desc>
