name: Bug report
description: Something draws wrongly, crashes, or is slower than it should be
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got instead. A screenshot of the chart helps.
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Minimal code to reproduce
      render: python
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: 'Output of: python -c "import lineova, numpy, sys; print(lineova.__version__, numpy.__version__, sys.version)"'
    validations:
      required: true
  - type: dropdown
    id: output
    attributes:
      label: Output format
      multiple: true
      options: [SVG, PDF, PNG, HTML, Jupyter]
