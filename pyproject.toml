[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lineova"
version = "0.1.0"
description = "Clean, fast charts with good defaults: four house styles, any data size."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Hugo Silvosa Cuervo" }]
keywords = ["charts", "plotting", "visualization", "svg", "graphs", "network"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Visualization",
  "Typing :: Typed",
]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
png = ["resvg-py>=0.1"]
pandas = ["pandas>=1.5"]
dev = ["pytest>=7", "pandas>=1.5"]

[project.urls]
Homepage = "https://github.com/hugo/lineova"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lineova = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
